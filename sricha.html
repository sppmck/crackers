<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SPPM Crackers — Diwali Order</title>
<style>
:root{
  --maroon:#5C1A1B; --maroon-2:#7A2E2A; --gold:#F2B33D; --gold-soft:#E8C9A0;
  --cream:#FFF8EE; --band:#F7E7C6; --band-line:#E5CFA3; --ink:#3A2A18;
  --ink-soft:#8A6A2F; --ink-mute:#9A7B4F; --saffron:#C25E00; --wa:#1FAA53;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overscroll-behavior-y:none}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:110px;touch-action:manipulation;
  overscroll-behavior-y:none}
.wrap{max-width:640px;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:var(--maroon)}
.top-in{padding:12px 16px 12px;display:flex;align-items:center;gap:10px}
.diya{flex:0 0 auto}
h1{margin:0;font-size:19px;font-weight:600;color:var(--gold);letter-spacing:.2px}
.tag{margin:1px 0 0;font-size:12px;color:var(--gold-soft)}
.searchbox{padding:0 16px 12px}
.searchbox input{width:100%;border:1px solid var(--maroon-2);background:var(--maroon-2);
  color:#FFF3DF;border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
.searchbox input::placeholder{color:var(--gold-soft)}
.bunting{height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,#E8630A 14px 28px,var(--maroon-2) 28px 42px)}
main{padding:4px 0 0}
details.cat{border-bottom:1px solid var(--band-line)}
summary.cat-head{list-style:none;cursor:pointer;background:var(--band);
  padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  -webkit-user-select:none;user-select:none}
summary.cat-head::-webkit-details-marker{display:none}
.cat-name{font-size:14.5px;font-weight:600;color:#5C3A00}
.cat-count{font-size:12px;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:4px}
.chev{transition:transform .15s ease;font-size:11px}
details[open] .chev{transform:rotate(90deg)}
.items{padding:0 16px;background:var(--cream)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid #F0E2CB}
.item:last-child{border-bottom:none}
.nm{font-size:14px}
.mt{font-size:12px;color:var(--ink-mute);margin-top:1px}
.mt b{color:var(--saffron);font-weight:600}
.ctl{flex:0 0 auto}
button{font-family:inherit;cursor:pointer}
.add{border:1.5px solid var(--saffron);color:var(--saffron);background:transparent;
  border-radius:9px;padding:7px 16px;font-size:13.5px;font-weight:600}
.step{display:none;align-items:center;gap:2px;background:#fff;
  border:1px solid var(--band-line);border-radius:9px;overflow:hidden}
.step button{border:none;background:transparent;color:var(--saffron);
  font-size:19px;font-weight:600;width:38px;height:38px;line-height:1}
.step .q{min-width:26px;text-align:center;font-size:14px;font-weight:600}
.item.on .add{display:none}
.item.on .step{display:flex}
.hide{display:none!important}
#noresult{display:none;padding:28px 16px;text-align:center;color:var(--ink-mute);font-size:14px}
section.terms{margin:20px 16px 8px}
details.tc{background:#FDF3E0;border:1px solid var(--band-line);border-radius:12px;overflow:hidden}
details.tc summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:14px;
  font-weight:600;color:#5C3A00;display:flex;justify-content:space-between;align-items:center}
details.tc summary::-webkit-details-marker{display:none}
.tc-body{padding:0 14px 12px;font-size:13px;color:#6E4E1E}
.tc-body ul{margin:6px 0;padding-left:18px}
.tc-body li{margin:5px 0}
.tc-body h3{font-size:13px;margin:10px 0 2px;color:#5C3A00}
footer{padding:16px;text-align:center;font-size:12px;color:var(--ink-mute)}
#cartbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;z-index:25;
  background:var(--maroon);border:none;width:100%;text-align:left;
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(120%);transition:transform .22s ease;border-radius:14px 14px 0 0}
#cartbar.show{transform:translateY(0)}
.cb-count{font-size:12px;color:var(--gold-soft)}
.cb-total{font-size:18px;font-weight:600;color:var(--gold)}
.cb-cta{background:var(--gold);color:#4A2800;font-size:14px;font-weight:600;
  border-radius:9px;padding:10px 16px}
#sheet{position:fixed;inset:0;z-index:30;background:var(--cream);overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none}
#sheet.open{display:block}
.sh-head{position:sticky;top:0;background:var(--maroon);z-index:5;
  display:flex;align-items:center;gap:10px;padding:14px 16px}
.sh-back{background:transparent;border:none;color:var(--gold-soft);font-size:22px;
  line-height:1;padding:2px 6px 4px}
.sh-title{font-size:17px;font-weight:600;color:var(--gold)}
.sh-body{max-width:640px;margin:0 auto;padding:14px 16px calc(30px + env(safe-area-inset-bottom))}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:13.5px}
.orow .oi{flex:1;min-width:0}
.orow .onm{overflow-wrap:anywhere}
.orow .omt{font-size:11.5px;color:var(--ink-mute)}
.orow .oline{font-weight:600;white-space:nowrap}
.orow .step{display:flex}
.orow .step button{width:32px;height:32px;font-size:17px}
.total-row{display:flex;justify-content:space-between;align-items:center;
  border-top:2px solid var(--band-line);margin-top:8px;padding:12px 0 4px}
.total-row .tl{font-size:15px;font-weight:600;color:var(--maroon)}
.total-row .tv{font-size:19px;font-weight:700;color:var(--maroon)}
.note{border-radius:9px;padding:9px 12px;font-size:12.5px;margin:10px 0}
.note.warn{background:#FDF0DC;border:1px solid var(--band-line);color:#8A5A00}
.note.ok{background:#E7F6EC;border:1px solid #BCE3C8;color:#1D6B3A}
.fld{margin-top:14px}
.fld label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.fld input,.fld textarea{width:100%;background:#fff;border:1px solid var(--band-line);border-radius:9px;
  padding:11px 12px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--saffron)}
.fld .opt{font-weight:400;color:var(--ink-mute)}
.err{display:none;font-size:12px;color:#B3261E;margin-top:4px}
.err.show{display:block}
#sendbtn{width:100%;margin-top:18px;background:var(--wa);border:none;color:#fff;
  font-size:15.5px;font-weight:600;border-radius:11px;padding:14px;display:flex;
  align-items:center;justify-content:center;gap:8px}
#sendbtn:disabled{background:#A8CBB4;cursor:not-allowed}
.sh-foot{margin-top:10px;text-align:center;font-size:12px;color:var(--ink-mute)}
.empty{padding:40px 0;text-align:center;color:var(--ink-mute);font-size:14px}
.clearbtn{display:none;margin:4px 0 0 auto;background:transparent;border:none;
  color:#B3261E;font-size:13px;font-weight:600;padding:8px 2px;text-decoration:underline}
#snack{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
  margin:0 auto;max-width:520px;z-index:40;background:#3A2A18;color:#FFF3DF;
  border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:10px;
  flex-wrap:wrap;font-size:13.5px}
#snack.show{display:flex}
#snack .sp{flex:1;min-width:140px}
#snack button{border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
#snack .new{background:var(--gold);color:#4A2800}
#snack .keep{background:transparent;color:var(--gold-soft);text-decoration:underline}
@media(min-width:720px){body{font-size:16px}}
</style>
</head>

/* ═══════════ App logic — no edits needed below ═══════════ */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rupee=n=>'₹'+n.toLocaleString('en-IN');
const qty={}, index={};
CATALOG.forEach(c=>c.items.forEach(it=>{index[it[0]]={name:it[1],unit:it[2],price:it[3],cat:c.cat};}));

/* analytics — loads only when a website ID is configured; page stays
   dependency-free otherwise. track() is a no-op if the script is blocked. */
if(CONFIG.ANALYTICS_WEBSITE_ID){
  const a=document.createElement('script');
  a.defer=true;a.src=CONFIG.ANALYTICS_SCRIPT;
  a.setAttribute('data-website-id',CONFIG.ANALYTICS_WEBSITE_ID);
  document.head.appendChild(a);
}
function track(ev,data){try{if(window.umami)window.umami.track(ev,data)}catch(e){}}

/* cart persistence — quantities live on the customer's phone until sent or cleared */
const STORE_KEY='sppmOrderV1';
let sentFlag=false;
function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(
    {q:qty,n:$('cname').value,p:$('cphone').value,a:$('caddr').value,sent:sentFlag}))}catch(e){}
}
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){return null}
}

document.title=CONFIG.SHOP_NAME+' — Diwali Order';
$('shopname').textContent=CONFIG.SHOP_NAME;
$('tagline').textContent=CONFIG.TAGLINE;
$('foot').textContent=CONFIG.SHOP_NAME+' · Wishing you a happy and safe Diwali';
$('shfoot').textContent='Free transportation on orders above '+rupee(CONFIG.FREE_TRANSPORT_ABOVE);
$('tcbody').innerHTML='<ul>'+CONFIG.TERMS.map(t=>'<li>'+t+'</li>').join('')+'</ul>'+
  '<h3>Please note</h3><ul>'+CONFIG.NOTES.map(t=>'<li>'+t+'</li>').join('')+'</ul>';

const catalogEl=$('catalog');
catalogEl.innerHTML=CATALOG.map((c,ci)=>{
  const rows=c.items.map(it=>
    '<div class="item" data-s="'+it[0]+'" data-name="'+(it[1]+' '+it[0]).toLowerCase().replace(/"/g,'&quot;')+'">'+
    '<div><div class="nm">'+it[1]+'</div><div class="mt">'+it[2]+' · <b>'+rupee(it[3])+'</b></div></div>'+
    '<div class="ctl"><button class="add" data-a="inc" aria-label="Add '+it[1].replace(/"/g,'&quot;')+'">Add</button>'+
    '<div class="step"><button data-a="dec" aria-label="Decrease quantity">−</button>'+
    '<span class="q">0</span><button data-a="inc" aria-label="Increase quantity">+</button></div></div></div>'
  ).join('');
  return '<details class="cat" data-ci="'+ci+'"><summary class="cat-head">'+
    '<span class="cat-name">'+c.cat+'</span>'+
    '<span class="cat-count">'+c.items.length+' items <span class="chev">▶</span></span></summary>'+
    '<div class="items">'+rows+'</div></details>';
}).join('');

function setQty(s,q){
  q=Math.max(0,Math.min(99,q));
  if(q===0) delete qty[s]; else qty[s]=q;
  const row=catalogEl.querySelector('.item[data-s="'+s+'"]');
  if(row){row.classList.toggle('on',q>0);row.querySelector('.q').textContent=q;}
  refreshBar();
  saveState();
  if($('sheet').classList.contains('open')) renderSheet();
}
function totals(){
  let units=0,products=0,amt=0;
  for(const s in qty){units+=qty[s];products++;amt+=qty[s]*index[s].price;}
  return {units,products,amt};
}
function refreshBar(){
  const t=totals();
  $('cbcount').textContent=t.units+(t.units===1?' item':' items');
  $('cbtotal').textContent=rupee(t.amt);
  $('cartbar').classList.toggle('show',t.units>0);
}
catalogEl.addEventListener('click',e=>{
  const btn=e.target.closest('button[data-a]');
  if(!btn) return;
  const s=btn.closest('.item').dataset.s;
  if(btn.dataset.a==='inc'&&!qty[s]) track('add-item',{item:index[s].name,category:index[s].cat});
  setQty(s,(qty[s]||0)+(btn.dataset.a==='inc'?1:-1));
});

/* search */
let deb;
$('search').addEventListener('input',e=>{
  clearTimeout(deb);
  deb=setTimeout(()=>filter(e.target.value.trim().toLowerCase()),120);
});
function filter(q){
  let any=false;
  catalogEl.querySelectorAll('details.cat').forEach(d=>{
    let n=0;
    d.querySelectorAll('.item').forEach(row=>{
      const hit=!q||row.dataset.name.includes(q);
      row.classList.toggle('hide',!hit);
      if(hit)n++;
    });
    d.classList.toggle('hide',n===0);
    d.open=q?n>0:false;
    if(n>0)any=true;
  });
  $('noresult').style.display=any?'none':'block';
}

/* order sheet */
const sheet=$('sheet');
function openSheet(){renderSheet();sheet.classList.add('open');document.body.style.overflow='hidden';track('view-order');}
function closeSheet(){sheet.classList.remove('open');document.body.style.overflow='';}
$('cartbar').addEventListener('click',openSheet);
$('backbtn').addEventListener('click',closeSheet);

function renderSheet(){
  const t=totals(), ol=$('orderlist');
  if(t.units===0){
    ol.innerHTML='<div class="empty">Your order is empty.<br>Go back and add some crackers!</div>';
  }else{
    ol.innerHTML=Object.keys(qty).map(s=>{
      const it=index[s];
      return '<div class="orow" data-s="'+s+'"><div class="oi"><div class="onm">'+it.name+'</div>'+
      '<div class="omt">'+it.unit+' · '+rupee(it.price)+'</div></div>'+
      '<div class="step"><button data-a="dec" aria-label="Decrease">−</button><span class="q">'+qty[s]+'</span>'+
      '<button data-a="inc" aria-label="Increase">+</button></div>'+
      '<span class="oline">'+rupee(qty[s]*it.price)+'</span></div>';
    }).join('');
  }
  $('shtotal').textContent=rupee(t.amt);
  const minN=$('minnote'), ship=$('shipnote');
  if(t.amt<CONFIG.MIN_ORDER){
    minN.style.display='block';
    minN.textContent='Add '+rupee(CONFIG.MIN_ORDER-t.amt)+' more to reach the minimum order of '+rupee(CONFIG.MIN_ORDER)+'.';
  }else minN.style.display='none';
  if(t.amt>=CONFIG.FREE_TRANSPORT_ABOVE){
    ship.className='note ok';ship.textContent='Your order qualifies for free transportation.';
  }else{
    ship.className='note warn';
    ship.textContent='Transportation charges extra. Orders above '+rupee(CONFIG.FREE_TRANSPORT_ABOVE)+' get free transportation.';
  }
  $('sendbtn').disabled=t.units===0||t.amt<CONFIG.MIN_ORDER;
  $('clearbtn').style.display=t.units>0?'block':'none';
}
$('orderlist').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-a]');
  if(!btn) return;
  const s=btn.closest('.orow').dataset.s;
  setQty(s,(qty[s]||0)+(btn.dataset.a==='inc'?1:-1));
});

/* clear order — two-tap confirm */
function clearCart(){
  Object.keys(qty).forEach(s=>delete qty[s]);
  catalogEl.querySelectorAll('.item.on').forEach(r=>{
    r.classList.remove('on');r.querySelector('.q').textContent='0';});
  refreshBar();saveState();
  if(sheet.classList.contains('open')) renderSheet();
}
let clearArm=null;
$('clearbtn').addEventListener('click',()=>{
  const b=$('clearbtn');
  if(clearArm){clearTimeout(clearArm);clearArm=null;b.textContent='Clear order';clearCart();return;}
  b.textContent='Tap again to confirm';
  clearArm=setTimeout(()=>{clearArm=null;b.textContent='Clear order';},3000);
});

/* "order sent?" banner — shown when returning from WhatsApp */
const snack=$('snack');
function maybeShowSnack(){
  if(sentFlag&&Object.keys(qty).length) snack.classList.add('show');
}
$('snackkeep').addEventListener('click',()=>{
  sentFlag=false;saveState();snack.classList.remove('show');
});
$('snacknew').addEventListener('click',()=>{
  sentFlag=false;clearCart();snack.classList.remove('show');closeSheet();
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') maybeShowSnack();
});
window.addEventListener('pageshow',e=>{if(e.persisted) maybeShowSnack();});

/* validation + WhatsApp */
$('cname').addEventListener('input',()=>{$('nameerr').classList.remove('show');saveState();});
$('cphone').addEventListener('input',()=>{$('phoneerr').classList.remove('show');saveState();});
$('caddr').addEventListener('input',saveState);

/* field events — report each field's value when the customer finishes
   editing it (helps debug order issues later) */
function fieldTracker(id,ev){
  let last='';
  $(id).addEventListener('blur',()=>{
    const v=$(id).value.trim();
    if(v&&v!==last){last=v;track(ev,{value:v});}
  });
}
fieldTracker('cname','field-name');
fieldTracker('cphone','field-phone');
fieldTracker('caddr','field-address');
function cleanPhone(v){
  let d=v.replace(/\D/g,'');
  if(d.length===12&&d.startsWith('91')) d=d.slice(2);
  if(d.length===11&&d.startsWith('0')) d=d.slice(1);
  return d;
}
function buildMessage(name,phone){
  const t=totals();
  let i=0;
  const lines=Object.keys(qty).map(s=>{
    const it=index[s];i++;
    return i+'. '+it.name+' — '+qty[s]+' × '+rupee(it.price)+' = '+rupee(qty[s]*it.price);
  });
  const addr=$('caddr').value.trim();
  let msg='🧨 *New order — '+CONFIG.SHOP_NAME+'*\n\n'+
    '*Name:* '+name+'\n*Phone:* '+phone+
    (addr?'\n*Address:* '+addr:'')+'\n\n*Items:*\n'+lines.join('\n')+
    '\n\n*Total: '+rupee(t.amt)+'* ('+t.products+' products, '+t.units+' units)\n\n';
  msg+=t.amt>=CONFIG.FREE_TRANSPORT_ABOVE
    ?'Eligible for free transportation'
    :'Transportation charges extra (free for orders above '+rupee(CONFIG.FREE_TRANSPORT_ABOVE)+')';
  return msg;
}
$('sendbtn').addEventListener('click',()=>{
  const name=$('cname').value.trim(), ph=cleanPhone($('cphone').value);
  const missing=[];
  if(name.length<2){$('nameerr').classList.add('show');missing.push('name');}
  if(ph.length!==10){$('phoneerr').classList.add('show');missing.push('phone');}
  if(missing.length){
    track('send-blocked',{missing:missing.join('+'),name:name,phone:$('cphone').value.trim()});
    return;
  }
  const url='https://wa.me/'+CONFIG.WHATSAPP_NUMBER+'?text='+encodeURIComponent(buildMessage(name,$('cphone').value.trim()));
  const t=totals();
  track('send-order',{amount:t.amt,products:t.products,units:t.units,
    name:name,phone:$('cphone').value.trim(),address:$('caddr').value.trim()});
  sentFlag=true;saveState();
  const w=window.open(url,'_blank');
  if(!w) location.href=url;
});

/* restore saved cart on load */
(function(){
  const saved=loadState();
  if(!saved) return;
  sentFlag=!!saved.sent;
  if(saved.n) $('cname').value=saved.n;
  if(saved.p) $('cphone').value=saved.p;
  if(saved.a) $('caddr').value=saved.a;
  if(saved.q) for(const s in saved.q){
    if(index[s]) setQty(s,parseInt(saved.q[s],10)||0);
  }
  maybeShowSnack();
})();
})();
</script>
